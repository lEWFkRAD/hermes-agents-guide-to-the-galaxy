name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Fork pull requests run untrusted code. Keep the token read-only, remove
# persisted checkout credentials, and never use pull_request_target here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate

  python:
    # Keep this transitional context until the repository ruleset moves from
    # `test` to the aggregate `Required PR checks` context.
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: 03fa32c92dd445eb64c7f67434dd91b32c40701d
          path: .hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check --upgrade pip==26.1.2
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -e .hermes-agent
      - run: python -m pytest test/kindle-plugin test/ci -q
      - name: Python syntax check
        run: python -m compileall -q kindle-plugin scripts test/kindle-plugin test/ci

  package:
    name: Build and smoke-test release archives
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: 03fa32c92dd445eb64c7f67434dd91b32c40701d
          path: .hermes-agent
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check --upgrade pip==26.1.2
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -e .hermes-agent
      - name: Run adapter and CI policy tests on Windows
        run: python -m pytest test/kindle-plugin test/ci -q
      - name: Audit the installed Windows Hermes test environment
        run: python scripts/audit_hermes_environment.py
      - name: Verify release metadata
        id: metadata
        shell: pwsh
        run: |
          $version = (& node scripts/verify-release-metadata.mjs).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Release metadata validation failed" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and verify exact archives
        shell: pwsh
        run: |
          node scripts/build-release-artifacts.mjs --version "${{ steps.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Release artifact build failed" }
          node scripts/smoke-release-artifacts.mjs --version "${{ steps.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Release artifact smoke test failed" }
          python scripts/smoke_plugin_archive.py "dist/kindle-scribe-plugin-v${{ steps.metadata.outputs.version }}.zip" --version "${{ steps.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Plugin archive syntax smoke test failed" }
      - name: Smoke-test whole-product archive
        shell: pwsh
        run: |
          $version = "${{ steps.metadata.outputs.version }}"
          $archive = Join-Path $PWD "dist/hermes-notebook-v$version.zip"
          $smoke = Join-Path $env:RUNNER_TEMP "hermes-notebook-product-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $smoke
          Push-Location (Join-Path $smoke "hermes-notebook-v$version")
          try {
            if (Test-Path -LiteralPath .git) { throw "Release archive unexpectedly contains Git metadata" }
            npm ci --ignore-scripts
            npm run validate
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-notebook-v${{ steps.metadata.outputs.version }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify every pull-request commit is signed off
        run: >-
          python scripts/check_dco.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          --actor "${{ github.actor }}"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: 03fa32c92dd445eb64c7f67434dd91b32c40701d
          path: .hermes-agent
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: python -m pip install --disable-pip-version-check --upgrade pip==26.1.2
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -e .hermes-agent
      - run: python -m pip_audit --requirement requirements-dev.txt
      - name: Audit the installed Hermes test environment
        run: python scripts/audit_hermes_environment.py

  required:
    # A push or manual run must not emit the protected pull-request context.
    name: "${{ github.event_name == 'pull_request' && 'Required PR checks' || 'CI summary' }}"
    if: always()
    needs: [node, python, package, dco, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          NODE_RESULT: ${{ needs.node.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DCO_RESULT: ${{ needs.dco.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          python - <<'PY'
          import os

          results = {
              "node": os.environ["NODE_RESULT"],
              "python": os.environ["PYTHON_RESULT"],
              "package": os.environ["PACKAGE_RESULT"],
              "dco": os.environ["DCO_RESULT"],
              "audit": os.environ["AUDIT_RESULT"],
          }
          failed = {
              name: results[name]
              for name in ("node", "python", "package", "audit")
              if results[name] != "success"
          }
          expected_dco = "success" if os.environ["EVENT_NAME"] == "pull_request" else "skipped"
          if results["dco"] != expected_dco:
              failed["dco"] = results["dco"]
          if failed:
              summary = ", ".join(f"{name}={result}" for name, result in sorted(failed.items()))
              raise SystemExit(f"Required CI lanes failed: {summary}")
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          PY
